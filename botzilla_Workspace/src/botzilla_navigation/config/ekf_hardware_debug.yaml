ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Debug variant of ekf_hardware.yaml — identical fusion config, but with
    # robot_localization's own built-in verbose diagnostics turned on. Every filter
    # cycle (prediction + each sensor correction, with the raw measurement, innovation,
    # and resulting state) gets written to debug_out_file. Built for the "URDF flips
    # between 0 and 180 degrees while stationary, no goal given" investigation — this
    # is the only way to see exactly what value the EKF is receiving/producing each
    # cycle, as opposed to just the final /odometry/filtered output.
    debug: true
    debug_out_file: /tmp/claude-1000/hwtest/ekf_debug.txt

    odom0: /odom_cov
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_relative: true
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
