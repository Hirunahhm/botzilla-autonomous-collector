# Simulation-only Nav2 parameter OVERLAY for BotZilla.
#
# This is NOT a standalone config. It is layered on top of nav2_params.yaml — ROS 2 merges
# multiple --params-file arguments in order, with later files winning — so it contains only
# values that must differ in Gazebo. nav2.launch.py applies it automatically whenever
# use_sim_time:=true.
#
# ── CURRENT STATUS: this overlay is a deliberate no-op ────────────────────────────────
# The values below now match nav2_params.yaml exactly. They are retained rather than
# deleted so the overlay mechanism stays wired up and tested, ready for the next genuine
# sim/hardware divergence — but nothing actually needs to differ today, and that is worth
# recording because it was hard-won.
#
# The overlay originally existed to zero the velocity floors (min_speed_xy 0.05,
# min_speed_theta 0.2) that hardware needed and simulation did not. Hardware needed them
# because the real Kobuki has a mechanical deadband: commanded yaw <= 0.12 rad/s produced
# no motion, so DWB asking for 0.063 rad/s meant the robot stood still while Nav2 believed
# it was driving. Simulation delivers a commanded velocity exactly, so there the same floor
# was actively harmful — measured live in Gazebo: 568 commands alternating +/-0.232 rad/s,
# 54 sign changes, 0.000 m travelled over 25 s in completely open floor, because the
# smallest legal in-place rotation (0.2 rad/s) always overshot the correction needed.
#
# Both sides of that conflict are now gone, because the deadband is compensated where it
# actually lives — in the hardware. kobuki_base_node closes the loop on its
# bias-calibrated rate gyro and wheel encoders, so a small commanded velocity is delivered
# on the real robot too, and nav2_params.yaml's floors could go back to 0.0 for everyone.
#
# The same reasoning retired the other planned divergence noted here previously:
# max_vel_theta was a candidate for a hardware override because the open-loop base
# delivered only ~56% of commanded yaw rate (0.40 commanded -> ~0.22 actual). Closed-loop
# control corrects that shortfall directly, so the honest physical value now holds on both
# platforms and no override is warranted.
#
# If you add a real override here later, say what was MEASURED that forced it — every
# entry above earned its place that way.

controller_server:
  ros__parameters:
    FollowPath:
      # Identical to nav2_params.yaml — see the no-op note in the header above.
      min_speed_xy: 0.0
      min_speed_theta: 0.0
